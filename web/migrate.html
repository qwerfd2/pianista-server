<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pianista Profile Migration</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
    body {
        background-image: url('/resource/bg.jpg');
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
        min-height: 100vh;
        overflow: hidden;
    }
    .migration-card {
        background: rgba(255,255,255,0.9);
        border-radius: 12px;
        padding: 2rem;
        max-width: 800px;
        margin: 5% auto;
        box-shadow: 0 4px 24px rgba(0,0,0,0.2);
    }
    .form-control {
        font-family: monospace;
        font-size: 1rem;
        letter-spacing: 1px;
    }
    </style>
</head>
<body>
    <div class="migration-card">
        <div class="d-flex justify-content-center align-items-center mb-4">
            <h3 class="text-center mb-0">Profile Migration</h3>
            <button type="button" class="btn btn-link ms-2 p-0" id="infoBtn" aria-label="Info" style="font-size:1.5rem;">
                <span class="bi bi-info-circle" style="vertical-align:middle;"></span>
            </button>
        </div>
        <form id="migrationForm">
            <div class="mb-3">
                <label for="oldAk" class="form-label">Old Account AK</label>
                <input type="text" class="form-control" id="oldAk" name="old_ak" required>
            </div>
            <div class="mb-3">
                <label for="newAk" class="form-label">New Account AK</label>
                <input type="text" class="form-control" id="newAk" name="new_ak" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Submit</button>
        </form>
        <div id="result" class="mt-3"></div>
    </div>
    <div class="modal fade" id="migrationModal" tabindex="-1" aria-labelledby="migrationModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="migrationModalLabel"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
            <div class="modal-body" id="migrationModalBody"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">OK</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('migrationForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const old_ak = document.getElementById('oldAk').value;
            const new_ak = document.getElementById('newAk').value;
            if (old_ak.length !== 64 || new_ak.length !== 64) {
                document.getElementById('migrationModalLabel').innerText = "Migration Failed";
                document.getElementById('migrationModalBody').innerHTML = "<strong>Status:</strong> <span class='text-danger'>FAILED</span><br><strong>Message:</strong> AK format is incorrect.";
                const modal = new bootstrap.Modal(document.getElementById('migrationModal'));
                modal.show();
                return;
            }
            if (old_ak === new_ak) {
                document.getElementById('migrationModalLabel').innerText = "Migration Failed";
                document.getElementById('migrationModalBody').innerHTML = "<strong>Status:</strong> <span class='text-danger'>FAILED</span><br><strong>Message:</strong> Old AK and New AK cannot be the same.";
                const modal = new bootstrap.Modal(document.getElementById('migrationModal'));
                modal.show();
                return;
            }
            const response = await fetch('/Migrate/Do', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({old_ak, new_ak})
            });
            const result = await response.json();
            document.getElementById('migrationModalLabel').innerText = result.status === "success" ? "Migration Successful" : "Migration Failed";
            document.getElementById('migrationModalBody').innerHTML =
            `<strong>Status:</strong> <span class="${result.status === 'success' ? 'text-success' : 'text-danger'}">${result.status.toUpperCase()}</span><br>
             <strong>Message:</strong> ${result.message}`;

            const modal = new bootstrap.Modal(document.getElementById('migrationModal'));
            modal.show();
            if (result.status === "success") {
                document.getElementById('oldAk').value = "";
                document.getElementById('newAk').value = "";
            }
        });

        document.getElementById('infoBtn').addEventListener('click', function() {
            document.getElementById('migrationModalLabel').innerText = "Migration Info";
            document.getElementById('migrationModalBody').innerHTML =
                `<p>This page allows you to swap your guest profile from one account to another using their Access Keys (AKs).<br>
                <br>
                <strong>Instructions:</strong><br>
                - Enter your <b>Old Account AK</b> and <b>New Account AK</b>.<br>
                - Both AKs are provided via in-game mail and is available to copy for 30 days after the account's creation.<br>
                - After submitting, your old account profile will swap with the new account.<br>
                <br>
                <span class="text-danger">To undo the process, simply revert the AKs and submit again.</span>
                <br><span class="text-danger">This feature is not available for OAuth (FB, Apple) accounts.</span>
                <br><span class="text-danger">Both devices will be forced to restart the game.</span></p>`;
            const modal = new bootstrap.Modal(document.getElementById('migrationModal'));
            modal.show();
        });
</script>
</body>
</html>
